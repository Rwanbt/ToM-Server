name: Auth security + baseline gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-redaction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - name: Enforce deterministic Bun and blocking lint
        run: node --test ci/toolchain-guard.cjs
      - name: Exercise real ingress paths with sentinel secrets
        run: |
          bun test --isolate \
            src/modules/legacy/matrix-identity-server/authentication-security.test.ts \
            src/modules/legacy/tom-server/identity-server/utils/authentication-security.test.ts \
            src/modules/legacy/utils/json-content-security.test.ts

  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      # NO continue-on-error: the global suite is currently NOT qualified.
      - name: All Bun tests — required release gate
        run: bun test --isolate

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - name: TypeScript — required release gate
        run: bun run type-check
